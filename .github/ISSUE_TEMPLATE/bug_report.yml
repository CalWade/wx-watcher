name: Bug report / 问题反馈
description: Report a reproducible issue without private data
body:
  - type: markdown
    attributes:
      value: '不要上传密钥、客户消息、数据库或未脱敏日志。Please use synthetic examples.'
  - type: textarea
    id: environment
    attributes:
      label: Versions / 环境版本
      description: macOS, architecture, WeChat build, NoteBridge, DSH, cost-meter
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior / 预期与实际
    validations:
      required: true
