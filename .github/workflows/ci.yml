name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: brew install sqlcipher
      - run: uv sync --frozen
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install chromium
      - run: uv run python scripts/check.py --profile core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-verification
          retention-days: 7
          path: |
            output/checks/
            output/verification.json
            output/coverage/coverage.json
            output/coverage/coverage.xml
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --frozen
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: uv run python scripts/check.py --profile ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-verification
          retention-days: 7
          path: output/checks/
