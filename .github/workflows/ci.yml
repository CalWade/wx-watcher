name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          python-version: '3.12'
      - run: brew install sqlcipher
      - run: uv sync --frozen
      - run: uv run ruff check wx_watcher scripts tests
      - run: uv run ruff format --check wx_watcher scripts tests
      - run: uv run python scripts/verify.py
      - run: swift test --package-path native -c release
      - run: node --check integrations/dsh/index.mjs
      - run: node --test tests/dsh/bridge.test.mjs
      - run: node --check wx_watcher/assets/app.js
      - run: uv run python scripts/check_release.py
  source-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          python-version: '3.12'
      - run: uv build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: uv run python scripts/check_release.py
