[project]
name = "notebridge"
version = "0.4.5"
description = "Local-first WeChat reader, macOS key tool and DSH-to-Feishu reply assistant"
readme = "README.md"
license = "MIT"
authors = [{name = "NoteBridge contributors"}]
requires-python = ">=3.12"
dependencies = ["zstandard>=0.23,<1"]

[project.urls]
Homepage = "https://github.com/CalWade/wx-watcher"
Issues = "https://github.com/CalWade/wx-watcher/issues"

[project.scripts]
notebridge = "wx_watcher.__main__:main"
wx-watcher = "wx_watcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wx_watcher", "note_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/dsh" = "wx_watcher/assets/dsh"

[dependency-groups]
build = [
    "pyinstaller>=6,<7",
]
dev = [
    "coverage>=7.17,<8",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["wx_watcher/_vendor", "native", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["wx_watcher"]
omit = ["*/wx_watcher/_vendor/*"]
parallel = true
relative_files = true
patch = ["subprocess"]
data_file = "output/coverage/.coverage"
context = "${NOTE_BRIDGE_COVERAGE_CONTEXT-}"

[tool.coverage.report]
omit = ["*/wx_watcher/_vendor/*"]
show_missing = true
precision = 2

[tool.notebridge.quality]
domain_lines = 95
domain_branches = 90
application_lines = 90
application_branches = 85
overall_lines = 80
overall_branches = 70
