[project]
name = "wx-watcher"
version = "0.2.0"
description = "Local-first WeChat reader, macOS key tool and DSH-to-Feishu reply assistant"
readme = "README.md"
license = "MIT"
authors = [{name = "WX Watcher contributors"}]
requires-python = ">=3.12"
dependencies = ["zstandard>=0.23,<1"]

[project.urls]
Homepage = "https://github.com/CalWade/wx-watcher"
Issues = "https://github.com/CalWade/wx-watcher/issues"

[project.scripts]
wx-watcher = "wx_watcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wx_watcher"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/dsh" = "wx_watcher/assets/dsh"

[dependency-groups]
build = [
    "pyinstaller>=6,<7",
]
